<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE600">
<title>LTP Ventas · La Tienda del Pintor</title>
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#FFE600;font-family:Inter,Roboto,Arial,sans-serif;color:#111}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
img{width:120px;height:auto;margin-bottom:12px}
h1{font-family:Anton,'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:40px;margin:0 0 4px;letter-spacing:1px}
p{margin:0 0 24px;color:#3A3A3A}
.sedes{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
a.sede{display:block;text-align:center;background:#D0101A;color:#fff;text-decoration:none;font-weight:600;font-size:18px;padding:16px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
a.sede:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
<img src="/logo.png" alt="La Tienda del Pintor">
<h1>LTP Ventas</h1>
<p>Escoge la sede</p>
<div class="sedes">
<a class="sede" href="/pinturasaleluis/">Pinturas Aleluis</a>
</div>
</div>
</body>
</html>
